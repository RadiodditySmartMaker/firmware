[env:nodara]
extends = nrf52840_base
board = nodara
board_level = pr
board_check = true
debug_tool = jlink
; upload_protocol = jlink
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v6_nodara.ld

; Font switches (independent):
;   custom_upload_external_cjk_font = true
;       After `pio upload`, host generates+writes the external QSPI font image.
;       false = host never touches QSPI font region.
;   -DCJKFONT_EMBED_INTERNAL_TABLE=1
;       Compile the internal glyph table into firmware flash.
;   -DCJKFONT_ALLOW_RUNTIME_EXT_REBUILD=1
;       Optional; default off. If set, firmware may erase/rewrite QSPI on bad header.
;       Leave unset/0 so runtime never overwrites external CJK font.
custom_upload_external_cjk_font = false

; Forward-compatible font parameters for future script modularization
custom_external_font_source = src/graphics/fonts/CjkFontData.cpp
custom_external_font_output = bin/cjk_font.bin
custom_external_font_target = qspi://cjk_font.bin
custom_external_font_type_name = CjkFont
custom_external_font_array_name = cjkFont
custom_external_font_key_size = 4
custom_external_font_glyph_width = 16
custom_external_font_glyph_height = 16
custom_external_font_bitmap_size = 32
custom_external_font_magic = 0x434A4B31
; v2 = key table sorted for QSPI binary search (v1 remains readable via chunked scan)
custom_external_font_version = 2
custom_external_font_max_bytes = 0x00080000

build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/nodara
  -DCJKFONT_EMBED_INTERNAL_TABLE=0
  -DCJKFONT_ALLOW_RUNTIME_EXT_REBUILD=0
  -DCJKFONT_CFG_TARGET_NAME='"qspi://cjk_font.bin"'
  -DCJKFONT_CFG_EXT_ADDR=0x00300000U
  -DCJKFONT_CFG_MAX_BYTES=0x00080000U
  -DCJKFONT_CFG_MAGIC=0x434A4B31U
  -DCJKFONT_CFG_VERSION=2U
  -DCJKFONT_CFG_KEY_SIZE=4U
  -DCJKFONT_CFG_BITMAP_SIZE=32U
  -DCJKFONT_CFG_GLYPH_WIDTH=16U
  -DCJKFONT_CFG_GLYPH_HEIGHT=16U
  -DCJKFONT_CFG_LINE_HEIGHT=20U
  -DCJKFONT_CFG_Y_OFFSET=-2
  -DNodara
  -DUSE_EINK
  -DUSE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -DCONFIG_NFCT_PINS_AS_GPIOS=1

build_src_filter =
  ${nrf52_base.build_src_filter}
  -<mqtt/>
  +<../variants/nrf52840/nodara>
lib_deps =
  ${nrf52840_base.lib_deps}
  https://github.com/meshtastic/GxEPD2/archive/55f618961db45a23eff0233546430f1e5a80f63a.zip
  lewisxhe/SensorLib@0.3.4
  adafruit/Adafruit SPIFlash @ ^5.1.1
